<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>竞品拆解台 · Agent 平台竞品分析 · 2026-08</title>
<style>
:root {
  --bg: #f7f5f2; --panel: #ffffff; --ink: #1c1b1a; --ink2: #57534e; --ink3: #8a847c;
  --line: #e6e1da; --accent: #c2571b; --accent-soft: #f6e8de; --mico: #2f5eff;
  --shadow: 0 1px 3px rgba(28,27,26,.08), 0 4px 16px rgba(28,27,26,.06);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---------- 骨架 ---------- */
#app { display: flex; min-height: 100vh; }
#sidenav {
  width: 232px; flex: 0 0 232px; padding: 18px 14px; border-right: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
#sidenav .brand { font-weight: 700; font-size: 16px; padding: 4px 8px 6px; }
#sidenav .brand small { display: block; font-weight: 400; color: var(--ink3); font-size: 11px; margin-top: 2px; }
#sidenav .badge-new {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px;
  background: var(--accent); color: #fff; margin-left: 4px; vertical-align: middle;
}
.nav-sec { color: var(--ink3); font-size: 11px; padding: 14px 8px 6px; letter-spacing: .08em; }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
  color: var(--ink2); cursor: pointer; font-size: 13px; border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg); }
.nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .ic { width: 18px; text-align: center; opacity: .8; }
#main { flex: 1; min-width: 0; padding: 26px 30px 80px; }

/* ---------- 通用组件 ---------- */
.h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
.sub { color: var(--ink2); margin-top: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--ink2); cursor: pointer;
}
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg); color: var(--ink3); border: 1px solid var(--line); }
.tag.type-开源 { background: #e8f3ea; color: #2b7a3d; border-color: #cfe6d4; }
.tag.type-闭源 { background: #f0e9f7; color: #7a4fb0; border-color: #e3d6f0; }
.tag.type-内部 { background: #e3ebfd; color: #2f5eff; border-color: #cdd9f7; }
.tag.type-已下架 { background: #f6e3e3; color: #b03a3a; border-color: #eccdcd; }

/* ---------- 首页 ---------- */
.hero { padding: 34px 34px 26px; border-radius: 18px; background: linear-gradient(135deg, #1c1b1a 0%, #3a332c 100%); color: #f5f1ea; margin-bottom: 24px; position: relative; overflow: hidden; }
.hero h1 { font-size: 26px; font-weight: 700; }
.hero p { color: #cfc8bd; margin-top: 8px; max-width: 720px; }
.hero .stats { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }
.hero .stats b { font-size: 22px; display: block; }
.hero .stats span { color: #b3aa9c; font-size: 12px; }
.hero .ribbon {
  display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: var(--accent); color: #fff; margin-top: 12px;
}
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pcard { padding: 16px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.pcard:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(28,27,26,.12); }
.pcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pcard .name { font-weight: 700; font-size: 15px; }
.pcard .motto { color: var(--accent); font-size: 12px; margin-top: 2px; }
.pcard .desc { color: var(--ink2); font-size: 12.5px; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .scores { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.pcard .scores i { font-style: normal; font-size: 10.5px; color: var(--ink3); background: var(--bg); border-radius: 4px; padding: 1px 6px; }
.pcard.new { border-left: 3px solid var(--accent); }

/* ---------- 板块对比 ---------- */
.lane-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lane-head .icon { font-size: 22px; }
.lane-idea { margin-top: 6px; color: var(--ink2); max-width: 900px; }
.rail { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 18px; }
.shot { overflow: hidden; cursor: zoom-in; }
.shot img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; display: block; border-bottom: 1px solid var(--line); background: #eee; }
.shot .cap { padding: 10px 12px; font-size: 12.5px; color: var(--ink2); }
.shot .cap b { color: var(--ink); }
.shot .who { display: flex; justify-content: space-between; padding: 10px 12px 0; align-items: center; }
.pm { margin-top: 26px; padding: 20px 22px; border-radius: var(--radius); background: #1c1b1a; color: #e9e4dc; }
.pm h3 { font-size: 14px; color: #f0b98a; margin-bottom: 12px; }
.pm .row { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 9px 0; border-top: 1px solid #383330; }
.pm .row:first-of-type { border-top: none; }
.pm .row b { color: #cfc8bd; font-size: 12.5px; }
.pm .row p { font-size: 13px; }
.pm .row.mico p { color: #9dbcff; }

/* ---------- 灯箱 + 气泡 ---------- */
#lightbox {
  position: fixed; inset: 0; background: rgba(20,18,16,.86); z-index: 50; display: none;
  align-items: center; justify-content: center; padding: 3vh 3vw;
}
#lightbox.on { display: flex; }
.lb-stage { position: relative; max-width: min(1280px, 94vw); max-height: 92vh; }
.lb-stage img { max-width: 100%; max-height: 86vh; display: block; border-radius: 8px; }
.lb-cap { color: #e9e4dc; margin-top: 10px; font-size: 13px; }
.lb-close { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: none; font-size: 16px; }
.hot {
  position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--accent); color: #fff; border: 2px solid #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(194,87,27,.25);
  animation: pulse 2.4s infinite; z-index: 3;
}
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(194,87,27,.35);} 50% { box-shadow: 0 0 0 8px rgba(194,87,27,.08);} }
.bubble {
  position: absolute; width: 300px; background: #fff; color: var(--ink); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index: 4; font-size: 12.5px;
}
.bubble b { display: block; margin-bottom: 4px; color: var(--accent); }
.bubble .x { position: absolute; top: 6px; right: 10px; color: var(--ink3); border: none; background: none; }

/* ---------- 源码解剖 ---------- */
.topic-tabs { display: flex; gap: 8px; margin: 14px 0 20px; flex-wrap: wrap; }
.impl { margin-bottom: 16px; overflow: hidden; }
.impl .head { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; }
.impl .head .t { font-weight: 700; font-size: 14px; }
.impl .head .f { color: var(--ink3); font-size: 11.5px; }
.impl .body { display: none; border-top: 1px solid var(--line); }
.impl.open .body { display: grid; grid-template-columns: 1.25fr 1fr; }
.impl.open .head { background: var(--accent-soft); }
.codepanel { background: #232019; color: #e8e2d4; padding: 16px 18px; overflow-x: auto; }
.codepanel .file { color: #9d937f; font-size: 11px; margin-bottom: 10px; }
.codepanel pre { font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-all; }
.points { padding: 14px 18px; }
.points li { margin: 7px 0 7px 16px; font-size: 13px; color: var(--ink2); }
.points li::marker { color: var(--accent); }
.rtable { width: 100%; border-collapse: collapse; margin-top: 12px; background: var(--panel); border-radius: var(--radius); overflow: hidden; }
.rtable th, .rtable td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: center; font-size: 12.5px; }
.rtable th { background: var(--panel); font-size: 12px; color: var(--ink3); }
.rtable td:first-child, .rtable th:first-child { text-align: left; font-weight: 600; }
.rtable td.note { text-align: left; color: var(--ink3); font-size: 12px; }
.rtable tr:last-child td { border-bottom: none; }
.sc { display: inline-block; min-width: 22px; padding: 1px 0; border-radius: 5px; font-weight: 700; font-size: 12px; }
.sc5 { background: #dcefe0; color: #20703a; } .sc4 { background: #eaf3dc; color: #4c7a1e; }
.sc3 { background: #f6efdd; color: #96730f; } .sc2 { background: #f7e8dc; color: #a85a1c; }
.sc1 { background: #f6e0e0; color: #a83a3a; }
.callout { margin-top: 18px; padding: 16px 20px; border-left: 4px solid var(--accent); background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0; }
.callout b { color: var(--accent); }

/* ---------- 对比工作台 ---------- */
.bench-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.bench-layout { display: grid; grid-template-columns: 460px 1fr; gap: 20px; align-items: start; }
#radar { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
.bench-actions { display: flex; gap: 10px; margin: 18px 0; }
.btn { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.report { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 28px; margin-top: 18px; }
.report h1 { font-size: 20px; } .report h2 { font-size: 15px; margin: 18px 0 8px; }
.report table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.report th, .report td { border-bottom: 1px solid var(--line); padding: 6px 8px; font-size: 12.5px; text-align: center; }
.report td:first-child, .report th:first-child { text-align: left; }
.report .pc { margin: 14px 0; }
.report ul { margin-left: 18px; color: var(--ink2); font-size: 13px; }

/* ---------- 任务面板视图（新增）---------- */
.taskmatrix { width: 100%; border-collapse: collapse; margin-top: 12px; background: var(--panel); border-radius: var(--radius); overflow: hidden; }
.taskmatrix th, .taskmatrix td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.taskmatrix th { background: var(--bg); font-size: 12px; color: var(--ink3); text-align: left; }
.taskmatrix td.rowlabel { background: var(--bg); font-weight: 700; font-size: 12.5px; min-width: 100px; }
.taskmatrix td .cell-img {
  width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left;
  display: block; border-radius: 6px; background: #eee; border: 1px solid var(--line);
}
.taskmatrix td .cell-cap { font-size: 11.5px; color: var(--ink2); margin-top: 6px; }
.taskmatrix td.mico-col { background: rgba(47,94,255,0.04); }
.taskmatrix td.mico-col .cell-cap { color: var(--mico); font-weight: 600; }
.taskmatrix-empty { padding: 18px; text-align: center; color: var(--ink3); font-size: 13px; }

/* ---------- 工作流剧本视图（新增）---------- */
.pb-step { margin-top: 18px; padding: 16px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pb-step .sn { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; }
.pb-step .st { font-size: 15px; font-weight: 700; margin: 4px 0 12px; }
.pb-step .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pb-step .cell { padding: 10px 12px; background: var(--bg); border-radius: 9px; }
.pb-step .cell .who { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; display: flex; justify-content: space-between; }
.pb-step .cell .act { font-size: 12px; color: var(--ink2); }
.pb-step .obs { margin-top: 12px; padding: 10px 14px; background: #fff8f0; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 12.5px; color: var(--ink); }
.pb-compare { margin-top: 18px; padding: 16px 20px; background: #f0f5ff; border-radius: var(--radius); }
.pb-compare h3 { color: var(--mico); margin-bottom: 8px; font-size: 14px; }
.pb-compare p { font-size: 13px; color: var(--ink2); }
.pb-mico { margin-top: 14px; padding: 14px 18px; background: #1c1b1a; color: #e9e4dc; border-radius: var(--radius); }
.pb-mico h3 { color: #f0b98a; font-size: 14px; margin-bottom: 8px; }
.pb-mico p { font-size: 13px; color: #cfc8bd; }
.pb-scenario { padding: 14px 18px; background: linear-gradient(135deg, #fff8f0 0%, #fef3e8 100%); border-radius: var(--radius); border: 1px solid var(--accent-soft); }
.pb-scenario h3 { color: var(--accent); font-size: 13px; margin-bottom: 6px; }
.pb-scenario p { font-size: 13.5px; }

/* ---------- AI 视角视图（新增）---------- */
.ailens-tabs { display: flex; gap: 4px; margin: 14px 0 18px; border-bottom: 2px solid var(--line); }
.ailens-tab { padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--ink2); border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.ailens-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.ailens-layout { display: grid; grid-template-columns: 280px 1fr; gap: 18px; }
.ailens-list { display: flex; flex-direction: column; gap: 6px; }
.ailens-item { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
.ailens-item:hover { background: var(--bg); }
.ailens-item.on { background: var(--accent-soft); border-color: var(--accent); }
.ailens-item .ai-name { font-weight: 700; font-size: 13px; }
.ailens-item .ai-meta { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.ailens-body { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.ailens-body h2 { font-size: 18px; margin-bottom: 4px; }
.ailens-body .engine { font-size: 12px; color: var(--ink3); margin-bottom: 12px; }
.ailens-body .summary { background: #fff8f0; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; margin-bottom: 18px; font-size: 13.5px; }
.ailens-body .ai-section h3 { font-size: 14px; color: var(--accent); margin: 14px 0 6px; }
.ailens-body .ai-section p { font-size: 13px; color: var(--ink2); margin: 4px 0; white-space: pre-wrap; }
.ailens-body .replay { margin-top: 18px; padding: 12px 16px; background: #f6f4ef; border-radius: 9px; }
.ailens-body .replay h4 { font-size: 12px; color: var(--ink3); margin-bottom: 6px; }
.ailens-body .replay pre { font-size: 12px; white-space: pre-wrap; line-height: 1.6; }
.ailens-body .replay .copy-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; margin-top: 8px; }
.prompt-builder { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.prompt-builder .sel-row { margin-bottom: 14px; }
.prompt-builder .sel-row b { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 6px; }
.prompt-builder textarea { width: 100%; min-height: 220px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #faf9f6; line-height: 1.7; resize: vertical; }
.prompt-builder .gen-actions { display: flex; gap: 10px; margin-top: 12px; }
.ailens-disabled {
  padding: 30px; text-align: center; background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius);
  color: var(--ink3); font-size: 13px;
}
.ailens-disabled code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; }

/* ---------- 产品深度评测（新增）---------- */
.dd-hero {
  padding: 30px 34px 24px; border-radius: 18px; background: linear-gradient(135deg, #1c1b1a 0%, #2a2a2e 100%);
  color: #f5f1ea; margin-bottom: 24px; position: relative; overflow: hidden;
}
.dd-hero h1 { font-size: 24px; font-weight: 700; }
.dd-hero .dd-tagline { color: #f0b98a; font-size: 14px; margin-top: 6px; }
.dd-hero .dd-meta { color: #b3aa9c; font-size: 11.5px; margin-top: 10px; line-height: 1.7; }
.dd-hero .dd-meta b { color: #cfc8bd; }
.dd-section { margin-bottom: 26px; }
.dd-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.dd-section h2 .num { color: var(--accent); font-family: ui-monospace, monospace; }
.dd-overview-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
.dd-overview-card { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.dd-overview-card p { font-size: 13.5px; color: var(--ink2); margin-bottom: 8px; }
.dd-scorecard { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.dd-scorecard h3 { font-size: 13px; color: var(--ink3); margin-bottom: 10px; }
.dd-scorecard .sc-row { display: grid; grid-template-columns: 90px 1fr 30px; align-items: center; gap: 10px; margin: 6px 0; font-size: 12.5px; }
.dd-shot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
.dd-shot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.dd-shot img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top left; display: block; border-bottom: 1px solid var(--line); background: #eee; }
.dd-shot .dd-shot-body { padding: 12px 16px; }
.dd-shot .dd-shot-cap { font-weight: 700; font-size: 13px; }
.dd-shot .dd-shot-note { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.dd-shot .dd-shot-tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 6px; }
.dd-code-block { margin-bottom: 14px; }
.dd-code-block .dd-code-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg); border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0; }
.dd-code-block .dd-code-head .t { font-weight: 700; font-size: 13px; }
.dd-code-block .dd-code-head .f { color: var(--ink3); font-size: 11px; }
.dd-code-block .codepanel { border-radius: 0 0 9px 9px; }
.dd-code-block .points { border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; }
.dd-philosophy h3 { font-size: 14px; color: var(--accent); margin: 12px 0 6px; }
.dd-philosophy p, .dd-philosophy li { font-size: 13px; color: var(--ink2); }
.dd-philosophy ul { margin-left: 18px; }
.dd-timeline { border-left: 2px solid var(--line); padding-left: 16px; }
.dd-timeline .tl-item { position: relative; padding: 6px 0 6px 8px; font-size: 13px; }
.dd-timeline .tl-item::before { content: ''; position: absolute; left: -22px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.dd-timeline .tl-item b { color: var(--ink3); font-size: 12px; margin-right: 8px; font-family: ui-monospace, monospace; }
.dd-conclusion { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.dd-conclusion .summary { font-size: 14px; margin-bottom: 12px; }
.dd-conclusion ul { margin-left: 18px; }
.dd-conclusion li { font-size: 13px; color: var(--ink2); margin: 4px 0; }
.dd-conclusion li b { color: var(--accent); }

@media (max-width: 1100px) {
  .bench-layout { grid-template-columns: 1fr; }
  .impl.open .body { grid-template-columns: 1fr; }
  .dd-overview-grid { grid-template-columns: 1fr; }
  .ailens-layout { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {

function downloadReport() {
  const ps = state.bench.map(id => P[id]);
  let md = `# Agent 平台对比报告\n\n${new Date().toISOString().slice(0, 10)} · 基于 2026-08-01/02 实机截图、源码与官方资料，评分为调研评估分（1-5）\n\n`;
  md += `## 能力矩阵\n\n| 产品 | ${TD_DIMS.map(([, n]) => n).join(' | ')} |\n|${'---|'.repeat(TD_DIMS.length + 1)}\n`;
  ps.forEach(p => { md += `| ${p.name} | ${TD_DIMS.map(([k]) => p.scores[k]).join(' | ')} |\n`; });
  ps.forEach(p => {
    md += `\n## ${p.name}（${p.type} · 主语：${p.motto}）\n\n${p.oneLiner}\n\n`;
    p.pros.forEach(x => md += `- ＋ ${x}\n`);

    md += `\n**对 MiCo**：${p.micoNote}\n`;
  });
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `agent平台对比报告_${ps.map(p => p.name).join('-')}.md`;
  a.click();
}

/* ================= 雷达图 ================= */
function drawRadar() {
  if (state.view !== 'bench') return;
  const cv = $('#radar'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2 + 8, R = 150;
  const n = TD_DIMS.length;
  ctx.clearRect(0, 0, W, H);
  for (let ring = 1; ring <= 5; ring++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = -Math.PI / 2 + (i % n) * 2 * Math.PI / n;
      const r = R * ring / 5;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = '#e6e1da'; ctx.lineWidth = 1; ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = '#ece7df'; ctx.stroke();
    ctx.fillStyle = '#57534e'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(TD_DIMS[i][1], cx + (R + 26) * Math.cos(a), cy + (R + 22) * Math.sin(a) + 4);
  }
  state.bench.forEach((id, pi) => {
    const p = P[id], color = BENCH_COLORS[pi % 8];
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const k = TD_DIMS[i % n][0], a = -Math.PI / 2 + (i % n) * 2 * Math.PI / n;
      const r = R * p.scores[k] / 5;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = color + '26'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < n; i++) {
      const k = TD_DIMS[i][0], a = -Math.PI / 2 + i * 2 * Math.PI / n;
      const r = R * p.scores[k] / 5;
      ctx.beginPath(); ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), 3, 0, 7);
      ctx.fillStyle = color; ctx.fill();
    }
  });
}

function copyText(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

    <tr>${TD_DIMS.map(([k]) => `<td><span class="sc sc${p.scores[k]}">${p.scores[k]}</span></td>`).join('')}</tr>
  </table>
  <div class="h2">Pros</div>
  <ul style="margin-left:18px;list-style:none;padding:0">${p.pros.map(x => `<li style="margin:4px 0">＋ ${x}</li>`).join('')}</ul>
  <div class="h2">Cons</div>
  <ul style="margin-left:18px;list-style:none;padding:0">${p.cons.map(x => `<li style="margin:4px 0">－ ${x}</li>`).join('')}</ul>
  <div class="callout"><b>对 MiCo：</b>${p.micoNote}</div>
  <div class="pm" style="margin-top:20px">
    <h3>◉ 这个产品还没有完整 demo/代码/理念评测</h3>
    <div class="row"><b>已收录内容</b><p>基础信息 + 8 维度评分 + Pros/Cons/启示（来自 v1 数据）。</p></div>
    <div class="row mico"><b>下一批</b><p>按"产品深度评测"模板补齐 demo 截图、code 片段、philosophy 分析。请到 <a href="https://github.com/andrewyng/openworker" style="color:#9dbcff">产品主页</a> 收集素材后提交。</p></div>
  </div>`;
}

/* ================= 渲染 ================= */
function render() {
  renderNav();
  const m = $('#main');
  if (state.view === 'lane') m.innerHTML = viewLane();
  else if (state.view === 'lab') m.innerHTML = viewLab();
  else if (state.view === 'bench') { m.innerHTML = viewBench(); requestAnimationFrame(drawRadar); }
  else if (state.view === 'tasks') m.innerHTML = viewTasks();
  else if (state.view === 'playbook' || state.view === 'playbooks') m.innerHTML = viewPlaybook();
  else if (state.view === 'ai-lens') m.innerHTML = viewAiLens();
  else if (state.view === 'product') m.innerHTML = viewProduct();
  else m.innerHTML = viewHome();
  window.scrollTo(0, 0);
}
route();
</script>
</body>
</html>
